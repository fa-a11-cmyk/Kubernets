apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservices.fullname" . }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ printf "%s-postgres" (include "microservices.fullname" .) | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" (include "microservices.fullname" .) | quote }}
  LOG_LEVEL: "INFO"

