apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservices.fullname" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "microservices.labels" . | nindent 4 }}
data:
  api-dashboard.json: |-
    {
      "title": "Microservices API",
      "uid": "microservices-api",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requêtes par seconde",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total[5m])) by (handler, method)", "legendFormat": "{{`{{method}} {{handler}}`}}", "refId": "A"}]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latence p95 (secondes)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, handler))", "legendFormat": "{{`{{handler}}`}}", "refId": "A"}]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Réponses HTTP par code",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [{"expr": "sum(rate(http_requests_total[5m])) by (status)", "legendFormat": "HTTP {{`{{status}}`}}", "refId": "A"}]
        }
      ]
    }

