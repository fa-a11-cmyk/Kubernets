{{- if and (not .Values.postgresql.existingSecret) (not .Values.postgresql.password) }}
{{- fail "postgresql.password must be provided (use a protected secret in production)" }}
{{- end }}
{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservices.fullname" . }}-database
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
{{- end }}

