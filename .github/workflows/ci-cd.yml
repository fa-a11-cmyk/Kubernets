name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install API and test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run API tests
        run: python -m pytest api/tests -q

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ format('ghcr.io/{0}/microservices-{1}:{2}', github.repository_owner, matrix.service, github.sha) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-local:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_LOCAL == 'true'
    needs: [publish]
    runs-on: [self-hosted, linux, kubernetes]
    environment: local-cluster
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to local Kubernetes with Helm
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "Configure the POSTGRES_PASSWORD repository secret."
            exit 1
          fi
          kubectl create secret generic demo-postgresql \
            --namespace microservices \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install demo ./helm/microservices \
            --namespace microservices \
            --values ./helm/microservices/values.yaml \
            --set api.image.repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/microservices-api" \
            --set api.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/microservices-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set postgresql.existingSecret=demo-postgresql \
            --set monitoring.serviceMonitor.enabled=true \
            --wait --timeout 5m
